name: CI

# 本 fork 优先保证 Windows 桌面壳可用：Windows job 是主路径，macOS / Linux
# 只做编译检查，不阻塞发布。CI 仅手动触发，避免日常推送在 runner 上排队。
on:
  workflow_dispatch:

jobs:
  windows:
    name: Windows build & test
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-core

      - name: Build the desktop shell
        run: cargo build -p hakimi-ui --locked

      - name: Test the core
        run: cargo test -p hakimi-core --lib --locked

      # 替代原来的 Linux shell 冒烟：起真实代理（127.0.0.1:0）验证 PAC 与
      # 健康端点，再跑一遍 CA 模块的单元测试。
      - name: Proxy & CA smoke
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/ca-smoke.ps1
